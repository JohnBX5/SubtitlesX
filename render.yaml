services:
  - type: web
    name: cinema-hub-subtitle-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/subtitles/health
    plan: free
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: CinemaHubSubtitleBackend
      - key: APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/subtitles.db
      - key: CACHE_DIR
        value: /tmp/cache
      - key: CACHE_TTL_HOURS
        value: 168
      - key: OPENSUBTITLES_BASE_URL
        value: https://api.opensubtitles.com/api/v1
      - key: OPENSUBTITLES_USER_AGENT
        value: CinemaHubSubtitleBackend v1.0.0
      - key: HTTP_TIMEOUT_SECONDS
        value: 20
      - key: MAX_SUBTITLE_FILE_SIZE_MB
        value: 10
      - key: MAX_SUBTITLE_CUE_COUNT
        value: 50000
      - key: MAX_CONCURRENT_REQUESTS
        value: 5
      - key: CORS_ORIGINS
        value: "*"
      # Set credentials securely in Render Dashboard
      - key: OPENSUBTITLES_API_KEY
        sync: false
      - key: OPENSUBTITLES_USERNAME
        sync: false
      - key: OPENSUBTITLES_PASSWORD
        sync: false
